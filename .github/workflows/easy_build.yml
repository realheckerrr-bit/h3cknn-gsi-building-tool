name: "⚡ EASY GSI Builder (Just paste URL!)"

# ==============================================================================
# EASY BUILD - Simplest possible way to build a GSI.
# Just paste your ROM download URL and hit Run!
# The rest is automatic.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "📥 Paste your ROM URL here — direct link OR Google Drive sharing link"
        required: true
        type: string
      output_name:
        description: "📛 Name for your GSI (optional)"
        required: false
        default: "My_GSI"
        type: string
      gsi_type:
        description: "💾 Image format"
        required: false
        default: "ext4 (most compatible)"
        type: choice
        options:
          - "ext4 (most compatible)"
          - "erofs (smaller size)"
      target_model:
        description: "Optional target model for compatibility warnings (example: SM-M127F)"
        required: false
        default: "generic"
        type: string

jobs:
  easy_build:
    name: "⚡ Easy GSI Build"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v4

      - name: "📊 Build Info"
        env:
          ROM_URL_INPUT: ${{ inputs.rom_url }}
          OUTPUT_NAME_INPUT: ${{ inputs.output_name }}
          GSI_TYPE_INPUT: ${{ inputs.gsi_type }}
          TARGET_MODEL_INPUT: ${{ inputs.target_model }}
        run: |
          echo "=================================================="
          echo "  ⚡ h3cknn Easy GSI Builder"
          echo "  ROM:    $ROM_URL_INPUT"
          echo "  Name:   $OUTPUT_NAME_INPUT"
          echo "  Format: $GSI_TYPE_INPUT"
          echo "=================================================="

      - name: "🧹 Free Disk Space"
        run: bash scripts/clean_disk.sh

      - name: "⚙️ Install Tools"
        run: bash scripts/setup_deps.sh

      - name: "🚀 Build GSI"
        env:
          SKIP_SETUP_DEPS: "1"
          ROM_URL_INPUT: ${{ inputs.rom_url }}
          OUTPUT_NAME_INPUT: ${{ inputs.output_name }}
          GSI_TYPE_INPUT: ${{ inputs.gsi_type }}
        run: |
          # Parse fs_type from the friendly label
          FS_RAW="$GSI_TYPE_INPUT"
          FS_TYPE="${FS_RAW%%\ *}"   # takes "ext4" from "ext4 (most compatible)"

          # Auto-detect OEM profile from URL
          ROM_URL="$ROM_URL_INPUT"
          ROM_TYPE="generic"
          echo "$ROM_URL" | grep -qi "pixel\|google"      && ROM_TYPE="pixel"
          echo "$ROM_URL" | grep -qi "hyperos\|miui\|xiaomi" && ROM_TYPE="hyperos"
          echo "$ROM_URL" | grep -qi "oneui\|samsung\|galaxy"  && ROM_TYPE="oneui"
          echo "$ROM_URL" | grep -qi "oxygen\|color\|oneplus\|oppo" && ROM_TYPE="oxygenos"
          echo "$ROM_URL" | grep -qi "motorola\|moto"     && ROM_TYPE="motorola"
          echo "  -> Auto-detected OEM profile: $ROM_TYPE"

          chmod +x scripts/*.sh
          bash scripts/port_rom.sh \
            "$ROM_URL" \
            "$OUTPUT_NAME_INPUT" \
            "$ROM_TYPE" \
            "$FS_TYPE"

      - name: "🔑 Checksum"
        env:
          ROM_URL_INPUT: ${{ inputs.rom_url }}
          OUTPUT_NAME_INPUT: ${{ inputs.output_name }}
          GSI_TYPE_INPUT: ${{ inputs.gsi_type }}
          TARGET_MODEL_INPUT: ${{ inputs.target_model }}
        run: |
          bash scripts/validate_gsi_output.sh workspace/output/*.img.xz workspace/output/*.img.gz
          cd workspace/output
          sha256sum *.img.xz *.img.gz > SHA256SUMS.txt
          IMAGE_MODE=$(cat ../image-mode.txt 2>/dev/null || printf '%s' "unknown")
          IMAGE_XZ=$(find . -maxdepth 1 -type f -name '*.img.xz' -print -quit)
          RAW_IMAGE_BYTES=$(xz --robot --list "$IMAGE_XZ" | awk -F '\t' '$1 == "totals" { print $5 }')
          FS_RAW="$GSI_TYPE_INPUT"
          FS_TYPE="${FS_RAW%%\ *}"
          BUILD_PROP=""
          for candidate in \
            ../system_root/system/build.prop \
            ../system_root/system/system/build.prop \
            ../system_root/build.prop; do
            if [ -f "$candidate" ]; then
              BUILD_PROP="$candidate"
              break
            fi
          done
          if [ -z "$BUILD_PROP" ]; then
            BUILD_PROP=$(find ../system_root -maxdepth 4 -type f -name build.prop -print -quit)
          fi
          bash ../../scripts/check_gsi_compatibility.sh \
            "$BUILD_PROP" \
            "$TARGET_MODEL_INPUT" \
            compatibility-report.txt \
            auto
          cat > build-info.txt <<EOF
          GSI build report
          ================
          Output name: $OUTPUT_NAME_INPUT
          Source ROM: $ROM_URL_INPUT
          Image mode: $IMAGE_MODE
          DSU signing: Community GSI; not signed with a Samsung/Google OEM key
          Requested filesystem: ${FS_TYPE}
          Target ABI profile: auto-detected from the source GSI/system properties
          Target model: $TARGET_MODEL_INPUT
          Compatibility preflight:
          $(cat compatibility-report.txt)
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Raw image size: ${RAW_IMAGE_BYTES} bytes
          EOF
          # Run IDs are unique even when two manual builds start in the same second.
          echo "RELEASE_TAG=easy-${GITHUB_RUN_ID}" >> $GITHUB_ENV

      - name: "📊 Build Summary"
        run: |
          echo "=================================================="
          echo "✅ BUILD COMPLETE!"
          echo "  Output:"
          ls -lh workspace/output/
          echo "=================================================="
        if: success()

      - name: "📤 Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.output_name }}-GSI"
          path: |
            workspace/output/*.img.xz
            workspace/output/*.img.gz
            workspace/output/SHA256SUMS.txt
            workspace/output/build-info.txt
            workspace/output/compatibility-report.txt
          retention-days: 14

      - name: "🏷️ Publish Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "📱 ${{ github.event.inputs.output_name }} GSI"
          body: |
            ## ⚡ Easy GSI Build

            | Field | Value |
            |---|---|
            | Source ROM | `${{ github.event.inputs.rom_url }}` |
            | Format | `${{ github.event.inputs.gsi_type }}` |
            | Image mode | See `build-info.txt` |
            | DSU signing | Community GSI; installer/device must accept it |
            | ABI profile | Auto-detected from the source GSI/system properties |
            | Runner | Ubuntu Latest |

            ### ⚡ How to use
            - **Device-specific boot chain:** the GSI contains system userspace
              only. Keep the target device's compatible vendor, kernel/boot, DTB,
              vbmeta, recovery, and documented installation method. Samsung users
              must use the exact-model stock-super/AP or TWRP workflow; this is
              not a universal Odin package.
            - **DSU:** the `.img.gz` asset is in DSU format, but installation still
               requires a working Android system, an unlocked bootloader, enough free
               storage, and an installer/device that accepts community non-OEM-signed images.
            - **Other devices:** follow that device's documented GSI installation
              method; the `.img.xz` asset is the system image, not a universal Odin package.
          files: |
            workspace/output/*.img.xz
            workspace/output/*.img.gz
            workspace/output/SHA256SUMS.txt
            workspace/output/build-info.txt
            workspace/output/compatibility-report.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release to Telegram
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          OUTPUT_NAME_INPUT: ${{ inputs.output_name }}
          TARGET_MODEL_INPUT: ${{ inputs.target_model }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${RELEASE_TAG}"
          html_escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'
          }
          TELEGRAM_GSI_NAME=$(printf '%s' "$OUTPUT_NAME_INPUT" | html_escape)
          TELEGRAM_IMAGE_MODE=$(grep -m1 '^Image mode:' workspace/output/build-info.txt | cut -d: -f2- | xargs | html_escape)
          TELEGRAM_FILESYSTEM=$(grep -m1 '^Requested filesystem:' workspace/output/build-info.txt | cut -d: -f2- | xargs | html_escape)
          TELEGRAM_RAW_SIZE=$(grep -m1 '^Raw image size:' workspace/output/build-info.txt | cut -d: -f2- | xargs | html_escape)
          TELEGRAM_SOURCE=$(grep -m1 '^Source ROM:' workspace/output/build-info.txt | cut -d: -f2- | xargs | html_escape)
          TELEGRAM_TARGET_MODEL=$(printf '%s' "$TARGET_MODEL_INPUT" | html_escape)
          TELEGRAM_COMPATIBILITY=$(grep -m1 '^Status:' workspace/output/compatibility-report.txt | cut -d: -f2- | xargs | html_escape)
          TELEGRAM_COMMIT=$(printf '%s' "$GITHUB_SHA" | html_escape)
          TELEGRAM_TEXT=$(printf '<b>%s (Treble GSI)</b>\n<a href="%s">Open GitHub Release</a>\n\n<blockquote expandable><b>Build info</b>\nImage mode: %s\nFilesystem: %s\nRaw image size: %s\nSource ROM: %s\nTarget model: %s\nCompatibility: %s\nCommit: %s\nRun: %s</blockquote>' \
            "$TELEGRAM_GSI_NAME" "$RELEASE_URL" "$TELEGRAM_IMAGE_MODE" \
            "$TELEGRAM_FILESYSTEM" "$TELEGRAM_RAW_SIZE" "$TELEGRAM_SOURCE" \
            "$TELEGRAM_TARGET_MODEL" "$TELEGRAM_COMPATIBILITY" "$TELEGRAM_COMMIT" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          printf '%s' "$TELEGRAM_TEXT" > workspace/output/telegram-message.html
          bash scripts/send_telegram_message.sh \
            "$TELEGRAM_BOT_TOKEN" \
            "$TELEGRAM_CHAT_ID" \
            workspace/output/telegram-message.html
