name: "🧪 Builder smoke tests"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v4

      - name: "🔎 Bash syntax"
        run: bash -n scripts/*.sh source/*.sh

      - name: "🧭 Direct GSI detection"
        run: bash scripts/test_gsi_detection.sh

      - name: "Safe Treble property patching"
        run: bash scripts/test_treble_patch.sh

      - name: "GSI compatibility preflight"
        run: bash scripts/test_gsi_compatibility.sh

      - name: "Treble source variant matrix"
        run: bash scripts/test_source_variants.sh

      - name: "Direct GSI property fast path"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends e2fsprogs
          bash scripts/test_direct_gsi_preflight.sh

      - name: "📦 Direct and extensionless GSI preservation"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends e2fsprogs
          bash scripts/test_preserve_gsi.sh

      - name: "🧱 OEM ext4 repack integration"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends e2fsprogs
          bash scripts/test_repack_ext4.sh

      - name: "🧱 OEM EROFS repack integration"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends erofs-utils
          bash scripts/test_repack_erofs.sh

      - name: "Samsung stock-super packaging"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            android-sdk-libsparse-utils android-libbase-dev e2fsprogs liblz4-tool p7zip-full
          bash scripts/install_lpmake.sh
          FORCE_LPMAKE_REINSTALL=1 \
          LPMake_FORCE_SOURCE_INDEX=2 \
            bash scripts/install_lpmake.sh
          lpmake --help >/dev/null
          bash scripts/test_samsung_super.sh
