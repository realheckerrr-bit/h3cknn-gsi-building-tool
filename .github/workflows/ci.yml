name: "🧪 Builder smoke tests"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: "📦 Checkout"
        uses: actions/checkout@v4

      - name: "🔎 Bash syntax"
        run: bash -n scripts/*.sh source/*.sh

      - name: "🧭 Direct GSI detection"
        run: bash scripts/test_gsi_detection.sh

      - name: "Samsung stock-super packaging"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            android-sdk-libsparse-utils android-libbase-dev e2fsprogs p7zip-full
          bash scripts/install_lpmake.sh
          bash scripts/test_samsung_super.sh
