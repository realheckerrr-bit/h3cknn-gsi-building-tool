name: "Android Emulator Screenshots"

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ðŸ”§ Port Treble GSI (OEM to GSI)"]
    types: [completed]

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM for Android emulator
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Boot Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            chmod +x scripts/capture_android_screenshots.sh
            bash scripts/capture_android_screenshots.sh android-screenshots

      - name: Upload Android screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshots
          path: android-screenshots/
          retention-days: 14
