name: Port Treble GSI (OEM to GSI)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "Direct ROM Download URL (zip / bin / tgz / img)"
        required: true
        type: string
      output_name:
        description: "Output GSI Name"
        required: true
        default: "Ported_GSI_ARM64"
        type: string
      rom_type:
        description: "OEM Profile"
        required: true
        default: "generic"
        type: choice
        options:
          - "generic"
          - "pixel"
          - "hyperos"
          - "oneui"
          - "oxygenos"
          - "motorola"
      fs_type:
        description: "Output Filesystem"
        required: true
        default: "ext4"
        type: choice
        options:
          - "ext4"
          - "erofs"

jobs:
  port_gsi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          chmod +x scripts/clean_disk.sh
          ./scripts/clean_disk.sh

      - name: Setup Build Dependencies
        run: |
          chmod +x scripts/setup_deps.sh
          ./scripts/setup_deps.sh

      - name: Execute GSI Porting Engine
        run: |
          chmod +x scripts/*.sh tools/*.py
          ./scripts/port_rom.sh \
            "${{ github.event.inputs.rom_url }}" \
            "${{ github.event.inputs.output_name }}" \
            "${{ github.event.inputs.rom_type }}" \
            "${{ github.event.inputs.fs_type }}"

      - name: Generate Release Checksums
        id: checksums
        run: |
          cd workspace/output
          sha256sum *.img.xz > SHA256SUMS.txt
          echo "RELEASE_TAG=v$(date +%Y.%m.%d-%H%M%S)" >> $GITHUB_ENV

      - name: Upload GSI to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}
          path: |
            workspace/output/*.img.xz
            workspace/output/SHA256SUMS.txt
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ github.event.inputs.output_name }} (Treble GSI)"
          body: |
            ## 📱 Generic System Image (GSI) Build
            - **Source ROM**: `${{ github.event.inputs.rom_url }}`
            - **OEM Profile**: `${{ github.event.inputs.rom_type }}`
            - **Filesystem**: `${{ github.event.inputs.fs_type }}`
            - **Target Architecture**: ARM64 A/B (Project Treble)

            ### ⚡ Flashing Instructions:
            ```bash
            # Unpack the xz archive
            unxz ${{ github.event.inputs.output_name }}.img.xz

            # Flash via Fastbootd (Dynamic Partitions / Modern Android)
            fastboot reboot fastboot
            fastboot flash system ${{ github.event.inputs.output_name }}.img
            fastboot -w
            fastboot reboot
            ```
          files: |
            workspace/output/*.img.xz
            workspace/output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
