name: "🔧 Port Treble GSI (OEM to GSI)"

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "📥 Direct ROM URL or Google Drive sharing link (zip / bin / tgz / img / GDrive)"
        required: true
        type: string
      output_name:
        description: "📛 Output GSI Name"
        required: true
        default: "Ported_GSI_ARM64"
        type: string
      rom_type:
        description: "📱 OEM Profile"
        required: true
        default: "generic"
        type: choice
        options:
          - "generic"
          - "pixel"
          - "hyperos"
          - "oneui"
          - "oxygenos"
          - "motorola"
      fs_type:
        description: "💾 Output Filesystem"
        required: true
        default: "ext4"
        type: choice
        options:
          - "ext4"
          - "erofs"

jobs:
  port_gsi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: port-gsi
      cancel-in-progress: true
    # Allow the workflow to create releases
    permissions:
      contents: write

    steps:
      - name: "📦 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🧹 Maximize Runner Disk Space"
        run: |
          chmod +x scripts/clean_disk.sh
          bash scripts/clean_disk.sh

      - name: "⚙️ Setup Build Dependencies"
        run: |
          chmod +x scripts/setup_deps.sh
          bash scripts/setup_deps.sh

      - name: "🚀 Execute GSI Porting Engine"
        env:
          SKIP_SETUP_DEPS: "1"
        run: |
          chmod +x scripts/*.sh
          bash scripts/port_rom.sh \
            "${{ github.event.inputs.rom_url }}" \
            "${{ github.event.inputs.output_name }}" \
            "${{ github.event.inputs.rom_type }}" \
            "${{ github.event.inputs.fs_type }}"

      - name: "🔑 Generate Release Checksums"
        id: checksums
        run: |
          cd workspace/output
          sha256sum *.img.xz > SHA256SUMS.txt

          IMAGE_XZ=$(find . -maxdepth 1 -type f -name '*.img.xz' -print -quit)
          RAW_IMAGE_BYTES=$(xz --robot --list "$IMAGE_XZ" | awk -F '\t' '$1 == "totals" { print $5 }')
          RAW_IMAGE_SIZE=$(numfmt --to=iec-i --suffix=B "$RAW_IMAGE_BYTES")

          BUILD_PROP=""
          for candidate in \
            ../system_root/system/build.prop \
            ../system_root/system/system/build.prop \
            ../system_root/build.prop; do
            if [ -f "$candidate" ]; then
              BUILD_PROP="$candidate"
              break
            fi
          done
          if [ -z "$BUILD_PROP" ]; then
            BUILD_PROP=$(find ../system_root -maxdepth 4 -type f -name build.prop -print -quit)
          fi

          prop() {
            local key value
            for key in "$@"; do
              value=$(grep -m1 "^${key}=" "$BUILD_PROP" | cut -d= -f2- || true)
              if [ -n "$value" ]; then
                printf '%s' "$value"
                return
              fi
            done
            printf '%s' "unknown"
          }

          cat > build-info.txt <<EOF
          GSI build report
          ================
          Output name: ${{ github.event.inputs.output_name }}
          Tool version: $(cat ../../VERSION)
          Source ROM: ${{ github.event.inputs.rom_url }}
          OEM profile: ${{ github.event.inputs.rom_type }}
          Filesystem: ${{ github.event.inputs.fs_type }}
          Target architecture: ARM64 A/B Treble GSI
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Built at UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Android build properties:
          Device brand: $(prop ro.product.system.brand ro.product.brand)
          Device manufacturer: $(prop ro.product.system.manufacturer ro.product.manufacturer)
          Device model: $(prop ro.product.system.model ro.product.model)
          Device codename: $(prop ro.product.system.device ro.product.device)
          Device board: $(prop ro.product.board ro.board.platform)
          Android version: $(prop ro.build.version.release)
          Android SDK: $(prop ro.build.version.sdk)
          Build fingerprint: $(prop ro.build.fingerprint)
          Build type: $(prop ro.build.type)
          Build tags: $(prop ro.build.tags)
          Build ID: $(prop ro.build.id)
          Security patch: $(prop ro.build.version.security_patch)
          Raw Image Size: $RAW_IMAGE_SIZE ($RAW_IMAGE_BYTES bytes)

          Checksums:
          $(cat SHA256SUMS.txt)
          EOF
          echo "RELEASE_TAG=v$(date +%Y.%m.%d-%H%M%S)" >> $GITHUB_ENV

      - name: "📤 Upload GSI to GitHub Actions Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}
          path: |
            workspace/output/*.img.xz
            workspace/output/SHA256SUMS.txt
            workspace/output/build-info.txt
          retention-days: 7

      - name: "🏷️ Create GitHub Release"
        uses: softprops/action-gh-release@v2
        # BUG FIX: 'startsWith(github.ref, "refs/heads/")' never fires on
        # workflow_dispatch from Actions UI. Removed condition so releases
        # are always created after a successful build.
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ github.event.inputs.output_name }} (Treble GSI)"
          body: |
            ## 📱 Generic System Image (GSI) Build
            - **Source ROM**: `${{ github.event.inputs.rom_url }}`
            - **OEM Profile**: `${{ github.event.inputs.rom_type }}`
            - **Filesystem**: `${{ github.event.inputs.fs_type }}`
            - **Target Architecture**: ARM64 A/B (Project Treble)
            - **Built on**: ${{ github.run_id }}
            - **Commit**: `${{ github.sha }}`
            - **Build report**: `build-info.txt`

            The build report contains the exact input parameters and SHA-256 checksum.

            ### ⚡ Flashing Instructions:
            ```bash
            # Unpack the xz archive
            unxz ${{ github.event.inputs.output_name }}.img.xz

            # Flash via Fastbootd (Dynamic Partitions / Modern Android)
            fastboot reboot fastboot
            fastboot flash system ${{ github.event.inputs.output_name }}.img
            fastboot -w
            fastboot reboot
            ```
          files: |
            workspace/output/*.img.xz
            workspace/output/SHA256SUMS.txt
            workspace/output/build-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
