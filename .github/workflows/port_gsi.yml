name: "🔧 Port Treble GSI (OEM to GSI)"

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "📥 Direct ROM URL or Google Drive sharing link (zip / bin / tgz / img / GDrive)"
        required: true
        type: string
      output_name:
        description: "📛 Output GSI Name"
        required: true
        default: "Ported_GSI_ARM64"
        type: string
      rom_type:
        description: "📱 OEM Profile"
        required: true
        default: "generic"
        type: choice
        options:
          - "generic"
          - "pixel"
          - "hyperos"
          - "oneui"
          - "oxygenos"
          - "motorola"
      fs_type:
        description: "💾 Output Filesystem"
        required: true
        default: "ext4"
        type: choice
        options:
          - "ext4"
          - "erofs"

jobs:
  port_gsi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: port-gsi
      cancel-in-progress: true
    # Allow the workflow to create releases
    permissions:
      contents: write

    steps:
      - name: "📦 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🧹 Maximize Runner Disk Space"
        run: |
          chmod +x scripts/clean_disk.sh
          bash scripts/clean_disk.sh

      - name: "⚙️ Setup Build Dependencies"
        run: |
          chmod +x scripts/setup_deps.sh
          bash scripts/setup_deps.sh

      - name: "🚀 Execute GSI Porting Engine"
        env:
          SKIP_SETUP_DEPS: "1"
        run: |
          chmod +x scripts/*.sh
          bash scripts/port_rom.sh \
            "${{ inputs.rom_url }}" \
            "${{ inputs.output_name }}" \
            "${{ inputs.rom_type }}" \
            "${{ inputs.fs_type }}"

      - name: "🔑 Generate Release Checksums"
        id: checksums
        run: |
          cd workspace/output
          sha256sum *.img.xz *.img.gz > SHA256SUMS.txt

          IMAGE_XZ=$(find . -maxdepth 1 -type f -name '*.img.xz' -print -quit)
          RAW_IMAGE_BYTES=$(xz --robot --list "$IMAGE_XZ" | awk -F '\t' '$1 == "totals" { print $5 }')
          RAW_IMAGE_SIZE=$(numfmt --to=iec-i --suffix=B "$RAW_IMAGE_BYTES")

          BUILD_PROP=""
          for candidate in \
            ../system_root/system/build.prop \
            ../system_root/system/system/build.prop \
            ../system_root/build.prop; do
            if [ -f "$candidate" ]; then
              BUILD_PROP="$candidate"
              break
            fi
          done
          if [ -z "$BUILD_PROP" ]; then
            BUILD_PROP=$(find ../system_root -maxdepth 4 -type f -name build.prop -print -quit)
          fi

          prop() {
            local key value
            for key in "$@"; do
              value=$(grep -m1 "^${key}=" "$BUILD_PROP" | cut -d= -f2- || true)
              if [ -n "$value" ]; then
                printf '%s' "$value"
                return
              fi
            done
            printf '%s' "unknown"
          }

          DEVICE_BRAND=$(prop ro.product.system.brand ro.product.brand)
          DEVICE_MANUFACTURER=$(prop ro.product.system.manufacturer ro.product.manufacturer)
          DEVICE_MODEL=$(prop ro.product.system.model ro.product.model)
          DEVICE_CODENAME=$(prop ro.product.system.device ro.product.device)
          DEVICE_BOARD=$(prop ro.product.board ro.board.platform)
          ANDROID_VERSION=$(prop ro.build.version.release)
          ANDROID_SDK=$(prop ro.build.version.sdk)
          BUILD_FINGERPRINT=$(prop ro.build.fingerprint ro.system.build.fingerprint)
          BUILD_TYPE=$(prop ro.build.type)
          BUILD_TAGS=$(prop ro.build.tags)
          BUILD_ID=$(prop ro.build.id)
          SECURITY_PATCH=$(prop ro.build.version.security_patch)

          html_escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'
          }

          TELEGRAM_GSI_NAME=$(printf '%s' '${{ inputs.output_name }}' | html_escape)
          TELEGRAM_DEVICE_BRAND=$(printf '%s' "$DEVICE_BRAND" | html_escape)
          TELEGRAM_DEVICE_MANUFACTURER=$(printf '%s' "$DEVICE_MANUFACTURER" | html_escape)
          TELEGRAM_DEVICE_MODEL=$(printf '%s' "$DEVICE_MODEL" | html_escape)
          TELEGRAM_DEVICE_CODENAME=$(printf '%s' "$DEVICE_CODENAME" | html_escape)
          TELEGRAM_DEVICE_BOARD=$(printf '%s' "$DEVICE_BOARD" | html_escape)
          TELEGRAM_ANDROID_VERSION=$(printf '%s' "$ANDROID_VERSION" | html_escape)
          TELEGRAM_ANDROID_SDK=$(printf '%s' "$ANDROID_SDK" | html_escape)
          TELEGRAM_BUILD_FINGERPRINT=$(printf '%s' "$BUILD_FINGERPRINT" | html_escape)
          TELEGRAM_BUILD_TYPE=$(printf '%s' "$BUILD_TYPE" | html_escape)
          TELEGRAM_BUILD_TAGS=$(printf '%s' "$BUILD_TAGS" | html_escape)
          TELEGRAM_BUILD_ID=$(printf '%s' "$BUILD_ID" | html_escape)
          TELEGRAM_SECURITY_PATCH=$(printf '%s' "$SECURITY_PATCH" | html_escape)
          TELEGRAM_OEM_PROFILE=$(printf '%s' '${{ inputs.rom_type }}' | html_escape)
          TELEGRAM_FILESYSTEM=$(printf '%s' '${{ inputs.fs_type }}' | html_escape)
          TELEGRAM_COMMIT=$(printf '%s' '${{ github.sha }}' | html_escape)
          RELEASE_TAG="v$(date +%Y.%m.%d-%H%M%S)"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}"

          cat > build-info.txt <<EOF
          GSI build report
          ================
          Output name: ${{ inputs.output_name }}
          Tool version: $(cat ../../VERSION)
          Source ROM: ${{ inputs.rom_url }}
          OEM profile: ${{ inputs.rom_type }}
          Filesystem: ${{ inputs.fs_type }}
          Target architecture: ARM64 A/B Treble GSI
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Built at UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Checksums:
          $(cat SHA256SUMS.txt)
          EOF

          cat > release-notes.md <<EOF
          ## Generic System Image (GSI) Build

          - **Source ROM**: ${{ inputs.rom_url }}
          - **OEM profile**: ${{ inputs.rom_type }}
          - **Filesystem**: ${{ inputs.fs_type }}
          - **Target architecture**: ARM64 A/B (Project Treble)
          - **Workflow run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - **Commit**: ${{ github.sha }}

          ### Android build properties

          - **Device brand**: $(prop ro.product.system.brand ro.product.brand)
          - **Device manufacturer**: $(prop ro.product.system.manufacturer ro.product.manufacturer)
          - **Device model**: $(prop ro.product.system.model ro.product.model)
          - **Device codename**: $(prop ro.product.system.device ro.product.device)
          - **Device board**: $(prop ro.product.board ro.board.platform)
          - **Android version**: $(prop ro.build.version.release) (SDK $(prop ro.build.version.sdk))
          - **Build fingerprint**: $(prop ro.build.fingerprint ro.system.build.fingerprint)
          - **Build type**: $(prop ro.build.type) / $(prop ro.build.tags)
          - **Build ID**: $(prop ro.build.id)
          - **Security patch**: $(prop ro.build.version.security_patch)
          - **Raw image size**: $RAW_IMAGE_SIZE ($RAW_IMAGE_BYTES bytes)

          ### Flashing

          Extract the image, then flash it using the device-specific GSI method.
          EOF
          cat > telegram-message.html <<EOF
          <b>${TELEGRAM_GSI_NAME} (Treble GSI)</b>
          <a href="${RELEASE_URL}">Open GitHub Release</a>

          <blockquote expandable><b>Build info</b>
          Device brand: ${TELEGRAM_DEVICE_BRAND}
          Device manufacturer: ${TELEGRAM_DEVICE_MANUFACTURER}
          Device model: ${TELEGRAM_DEVICE_MODEL}
          Device codename: ${TELEGRAM_DEVICE_CODENAME}
          Device board: ${TELEGRAM_DEVICE_BOARD}
          Android version: ${TELEGRAM_ANDROID_VERSION}
          Android SDK: ${TELEGRAM_ANDROID_SDK}
          Build fingerprint: ${TELEGRAM_BUILD_FINGERPRINT}
          Build type: ${TELEGRAM_BUILD_TYPE}
          Build tags: ${TELEGRAM_BUILD_TAGS}
          Build ID: ${TELEGRAM_BUILD_ID}
          Security patch: ${TELEGRAM_SECURITY_PATCH}
          Raw image size: ${RAW_IMAGE_SIZE} (${RAW_IMAGE_BYTES} bytes)
          OEM profile: ${TELEGRAM_OEM_PROFILE}
          Filesystem: ${TELEGRAM_FILESYSTEM}
          Commit: ${TELEGRAM_COMMIT}
          </blockquote>
          EOF

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: "📤 Upload GSI to GitHub Actions Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: |
            workspace/output/*.img.xz
            workspace/output/*.img.gz
            workspace/output/SHA256SUMS.txt
            workspace/output/build-info.txt
          retention-days: 7

      - name: "🏷️ Create GitHub Release"
        uses: softprops/action-gh-release@v2
        # BUG FIX: 'startsWith(github.ref, "refs/heads/")' never fires on
        # workflow_dispatch from Actions UI. Removed condition so releases
        # are always created after a successful build.
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ inputs.output_name }} (Treble GSI)"
          body_path: workspace/output/release-notes.md
          files: |
            workspace/output/*.img.xz
            workspace/output/*.img.gz
            workspace/output/SHA256SUMS.txt
            workspace/output/build-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release to Telegram
        if: success()
        # A Telegram outage or rotated token must not invalidate a completed
        # GSI build and GitHub release. The step still prints curl's error so
        # the secret can be corrected without hiding the notification failure.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          curl --fail --silent --show-error --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$(cat workspace/output/telegram-message.html)"
