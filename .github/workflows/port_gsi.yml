name: "🔧 Port Treble GSI (OEM to GSI)"

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "📥 Direct ROM URL or Google Drive sharing link (zip / bin / tgz / img / GDrive)"
        required: true
        type: string
      output_name:
        description: "📛 Output GSI Name"
        required: true
        default: "Ported_GSI_ARM64"
        type: string
      rom_type:
        description: "📱 OEM Profile"
        required: true
        default: "generic"
        type: choice
        options:
          - "generic"
          - "pixel"
          - "hyperos"
          - "oneui"
          - "oxygenos"
          - "motorola"
      fs_type:
        description: "💾 Output Filesystem"
        required: true
        default: "ext4"
        type: choice
        options:
          - "ext4"
          - "erofs"

jobs:
  port_gsi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: port-gsi
      cancel-in-progress: true
    # Allow the workflow to create releases
    permissions:
      contents: write

    steps:
      - name: "📦 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🧹 Maximize Runner Disk Space"
        run: |
          chmod +x scripts/clean_disk.sh
          bash scripts/clean_disk.sh

      - name: "⚙️ Setup Build Dependencies"
        run: |
          chmod +x scripts/setup_deps.sh
          bash scripts/setup_deps.sh

      - name: "🚀 Execute GSI Porting Engine"
        env:
          SKIP_SETUP_DEPS: "1"
        run: |
          chmod +x scripts/*.sh
          bash scripts/port_rom.sh \
            "${{ github.event.inputs.rom_url }}" \
            "${{ github.event.inputs.output_name }}" \
            "${{ github.event.inputs.rom_type }}" \
            "${{ github.event.inputs.fs_type }}"

      - name: "🔑 Generate Release Checksums"
        id: checksums
        run: |
          cd workspace/output
          sha256sum *.img.xz > SHA256SUMS.txt
          cat > build-info.txt <<EOF
          GSI build report
          ================
          Output name: ${{ github.event.inputs.output_name }}
          Tool version: $(cat ../../VERSION)
          Source ROM: ${{ github.event.inputs.rom_url }}
          OEM profile: ${{ github.event.inputs.rom_type }}
          Filesystem: ${{ github.event.inputs.fs_type }}
          Target architecture: ARM64 A/B Treble GSI
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Built at UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Checksums:
          $(cat SHA256SUMS.txt)
          EOF
          echo "RELEASE_TAG=v$(date +%Y.%m.%d-%H%M%S)" >> $GITHUB_ENV

      - name: "📤 Upload GSI to GitHub Actions Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}
          path: |
            workspace/output/*.img.xz
            workspace/output/SHA256SUMS.txt
            workspace/output/build-info.txt
          retention-days: 7

      - name: "🏷️ Create GitHub Release"
        uses: softprops/action-gh-release@v2
        # BUG FIX: 'startsWith(github.ref, "refs/heads/")' never fires on
        # workflow_dispatch from Actions UI. Removed condition so releases
        # are always created after a successful build.
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ github.event.inputs.output_name }} (Treble GSI)"
          body: |
            ## 📱 Generic System Image (GSI) Build
            - **Source ROM**: `${{ github.event.inputs.rom_url }}`
            - **OEM Profile**: `${{ github.event.inputs.rom_type }}`
            - **Filesystem**: `${{ github.event.inputs.fs_type }}`
            - **Target Architecture**: ARM64 A/B (Project Treble)
            - **Built on**: ${{ github.run_id }}
            - **Commit**: `${{ github.sha }}`
            - **Build report**: `build-info.txt`

            The build report contains the exact input parameters and SHA-256 checksum.
            After the build, the workflow attempts to attach Android emulator screenshots
            (`build-info.png` and `home-screen.png`) to this same release.

            ### ⚡ Flashing Instructions:
            ```bash
            # Unpack the xz archive
            unxz ${{ github.event.inputs.output_name }}.img.xz

            # Flash via Fastbootd (Dynamic Partitions / Modern Android)
            fastboot reboot fastboot
            fastboot flash system ${{ github.event.inputs.output_name }}.img
            fastboot -w
            fastboot reboot
            ```
          files: |
            workspace/output/*.img.xz
            workspace/output/SHA256SUMS.txt
            workspace/output/build-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM for Android emulator
        continue-on-error: true
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Install Android emulator packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-30" \
            "system-images;android-30;google_apis;x86_64"

      - name: Boot Android emulator and capture screenshots
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            chmod +x scripts/capture_android_screenshots.sh
            bash scripts/capture_android_screenshots.sh android-screenshots

      - name: Upload screenshots to GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_name }}-android-screenshots
          path: android-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Attach screenshots to the GSI release
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            android-screenshots/build-info.png
            android-screenshots/home-screen.png
            android-screenshots/build-properties.txt
            workspace/output/build-info.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
