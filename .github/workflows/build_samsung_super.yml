name: "Build Samsung Super GSI Package"

on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: "Direct URL to the matching stock AP.tar.md5 (required for Odin output), super.img.lz4, or super.img"
        required: true
        type: string
      gsi_url:
        description: "Direct URL to the GSI .img.xz, .img.gz, or .img"
        required: true
        type: string
      device_model:
        description: "Exact Samsung model, for example SM-M127F"
        required: true
        type: string
      output_name:
        description: "Output package name"
        required: true
        default: "M12_GSI_Super"
        type: string
      gsi_format:
        description: "Format of the downloaded GSI URL"
        required: true
        default: "img.xz"
        type: choice
        options:
          - "img.xz"
          - "img.gz"
          - "img"
      boot_url:
        description: "Optional exact-device boot.img.lz4/boot.img or archive (for a GSI-compatible kernel)"
        required: false
        default: ""
        type: string
      remove_product:
        description: "Remove Samsung product logical partition (recommended for Exynos 850 GSI packages)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  build_samsung_super:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: bash scripts/clean_disk.sh

      - name: Install dependencies
        run: bash scripts/setup_deps.sh

      - name: Download matching stock and GSI inputs
        env:
          STOCK_URL_INPUT: ${{ inputs.stock_url }}
          GSI_URL_INPUT: ${{ inputs.gsi_url }}
          GSI_FORMAT_INPUT: ${{ inputs.gsi_format }}
          BOOT_URL_INPUT: ${{ inputs.boot_url }}
        run: |
          mkdir -p workspace/samsung-inputs
          curl --fail --location --retry 3 --retry-delay 5 \
            "$STOCK_URL_INPUT" -o workspace/samsung-inputs/stock-input
          curl --fail --location --retry 3 --retry-delay 5 \
            "$GSI_URL_INPUT" -o "workspace/samsung-inputs/gsi.$GSI_FORMAT_INPUT"
          if [ -n "$BOOT_URL_INPUT" ]; then
            curl --fail --location --retry 3 --retry-delay 5 \
              "$BOOT_URL_INPUT" -o workspace/samsung-inputs/boot-input
          fi

      - name: Build and validate Samsung super package
        env:
          DEVICE_MODEL_INPUT: ${{ inputs.device_model }}
          OUTPUT_NAME_INPUT: ${{ inputs.output_name }}
          BOOT_INPUT_PATH: workspace/samsung-inputs/boot-input
          REMOVE_PRODUCT_INPUT: ${{ inputs.remove_product }}
        run: |
          chmod +x scripts/*.sh
          if [ -f "$BOOT_INPUT_PATH" ]; then
            export SAMSUNG_BOOT_INPUT="$BOOT_INPUT_PATH"
          fi
          if [ "$REMOVE_PRODUCT_INPUT" = "true" ]; then
            export SAMSUNG_REMOVE_PRODUCT=1
          else
            export SAMSUNG_REMOVE_PRODUCT=0
          fi
          SAMSUNG_DEVICE_MODEL="$DEVICE_MODEL_INPUT" \
            bash scripts/build_samsung_super.sh \
              workspace/samsung-inputs/stock-input \
              workspace/samsung-inputs/gsi.* \
              "$OUTPUT_NAME_INPUT" \
              workspace/samsung-work \
              workspace/output
          bash scripts/verify_samsung_package.sh \
            workspace/output \
            "$OUTPUT_NAME_INPUT"
          cd workspace/output
          find . -maxdepth 1 -type f \( -name '*.tar' -o -name '*.tar.md5' -o -name '*.img' -o -name '*.img.lz4' -o -name '*.build-info.txt' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: |
            workspace/output/*.tar
            workspace/output/*.tar.md5
            workspace/output/super.img
            workspace/output/super.img.lz4
            workspace/output/*.img.lz4
            workspace/output/*.build-info.txt
            workspace/output/SHA256SUMS.txt
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "samsung-${{ github.run_id }}"
          name: "${{ inputs.output_name }} (${{ inputs.device_model }})"
          body: |
            ## Samsung stock-super GSI package

            This package replaces the `system` logical partition in the supplied stock super image and can remove the stock `product` logical partition when selected.

            - **Device model**: `${{ inputs.device_model }}`
            - **Stock source**: `${{ inputs.stock_url }}`
            - **GSI source**: `${{ inputs.gsi_url }}`
            - **Odin output**: `${{ inputs.output_name }}-odin.tar.md5` (plus the raw `.tar`) is created only when the supplied AP contains supported matching vbmeta images; root/system/vendor vbmeta images present in that AP are patched and included.
            - **Boot**: the exact AP stock `boot.img.lz4` is included automatically when present; an explicitly supplied `boot_url` overrides it for a matching custom kernel.
            - **Product**: `${{ inputs.remove_product }}` (removing Samsung product is recommended for Exynos 850 GSI packages).
            - **Preserved**: stock vendor/odm/system_ext, recovery, kernel, and separate `dtbo`/`vendor_boot`/`init_boot` files; the matching AP stock boot is included unchanged when present, unless the optional exact-device boot input overrides it.

            The Odin tar contains Samsung content-size LZ4 `super.img.lz4` plus the matching AP vbmeta images
            with AVB disable flags. Use the exact matching Samsung firmware, recovery, multidisabler,
            factory-reset, and kernel procedure for the device. Do not use it on another model.
          files: |
            workspace/output/*.tar
            workspace/output/*.tar.md5
            workspace/output/super.img
            workspace/output/super.img.lz4
            workspace/output/*.img.lz4
            workspace/output/*.build-info.txt
            workspace/output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release to Telegram
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEVICE_MODEL_INPUT: ${{ inputs.device_model }}
          OUTPUT_NAME_INPUT: ${{ inputs.output_name }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          RELEASE_TAG="samsung-${GITHUB_RUN_ID}"
          RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${RELEASE_TAG}"
          html_escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'
          }
          NAME_ESCAPED=$(printf '%s' "$OUTPUT_NAME_INPUT" | html_escape)
          MODEL_ESCAPED=$(printf '%s' "$DEVICE_MODEL_INPUT" | html_escape)
          BUILD_INFO_PATH=$(find workspace/output -maxdepth 1 -type f -name '*.build-info.txt' -print -quit)
          if [ -n "$BUILD_INFO_PATH" ]; then
            BUILD_INFO_ESCAPED=$(html_escape < "$BUILD_INFO_PATH")
          else
            BUILD_INFO_ESCAPED=$(printf 'Device: %s\nBuild metadata was not produced.' "$MODEL_ESCAPED")
          fi
          TEXT=$(printf '<b>%s Samsung Super GSI</b>\n<a href="%s">Open GitHub Release</a>\n\n<blockquote expandable><b>Build info</b>\n%s\n</blockquote>' \
            "$NAME_ESCAPED" "$RELEASE_URL" "$BUILD_INFO_ESCAPED")
          curl --fail --silent --show-error --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}" || \
            echo "::warning::Telegram notification failed."
