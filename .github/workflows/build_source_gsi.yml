name: "🔨 Build Source-Based Treble GSI"

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: "🔗 Android ROM Manifest URL"
        required: true
        default: "https://github.com/LineageOS/android.git"
        type: string
      manifest_branch:
        description: "🌿 Manifest Branch"
        required: true
        default: "lineage-21.0"
        type: string
      treble_branch:
        description: "🌿 TrebleDroid Revision / Branch"
        required: true
        default: "android-14.0"
        type: string
      variant:
        description: "TrebleDroid target: arm64/arm/a64, A-only/A-B, apps/root suffixes"
        required: true
        default: "treble_arm64_bvN"
        type: string
      build_type:
        description: "🛠️ Build Type"
        required: true
        default: "userdebug"
        type: choice
        options:
          - "userdebug"
          - "user"
      target_model:
        description: "Optional target model for compatibility warnings (example: SM-M127F)"
        required: false
        default: "generic"
        type: string

jobs:
  build_source_gsi:
    runs-on: ubuntu-latest
    # Allow the workflow to create releases
    permissions:
      contents: write

    steps:
      - name: "📦 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🧹 Maximize Runner Disk Space"
        run: |
          chmod +x scripts/clean_disk.sh
          bash scripts/clean_disk.sh

      - name: "⚙️ Setup Build Dependencies & Repo Tool"
        run: |
          chmod +x scripts/setup_deps.sh
          bash scripts/setup_deps.sh
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+rx /usr/local/bin/repo

      - name: "🔄 Sync Source Tree & Apply Treble Patches"
        env:
          MANIFEST_URL_INPUT: ${{ inputs.manifest_url }}
          MANIFEST_BRANCH_INPUT: ${{ inputs.manifest_branch }}
          TREBLE_BRANCH_INPUT: ${{ inputs.treble_branch }}
        run: |
          chmod +x source/*.sh
          bash source/sync_and_patch.sh \
            "$MANIFEST_URL_INPUT" \
            "$MANIFEST_BRANCH_INPUT" \
            "$TREBLE_BRANCH_INPUT" \
            "$GITHUB_WORKSPACE/android_source"

      - name: "🏗️ Compile System Image"
        env:
          VARIANT_INPUT: ${{ inputs.variant }}
          BUILD_TYPE_INPUT: ${{ inputs.build_type }}
        run: |
          bash source/build_source.sh \
            "$GITHUB_WORKSPACE/android_source" \
            "$VARIANT_INPUT" \
            "$BUILD_TYPE_INPUT"

      - name: "🔑 Generate Checksums"
        env:
          VARIANT_INPUT: ${{ inputs.variant }}
          BUILD_TYPE_INPUT: ${{ inputs.build_type }}
          MANIFEST_URL_INPUT: ${{ inputs.manifest_url }}
          MANIFEST_BRANCH_INPUT: ${{ inputs.manifest_branch }}
          TREBLE_BRANCH_INPUT: ${{ inputs.treble_branch }}
          TARGET_MODEL_INPUT: ${{ inputs.target_model }}
        run: |
          # BUG FIX: path must be absolute or relative to GITHUB_WORKSPACE
          bash scripts/validate_gsi_output.sh \
            "$GITHUB_WORKSPACE"/android_source/out_gsi/*.img.xz \
            "$GITHUB_WORKSPACE"/android_source/out_gsi/*.img.gz
          case "$VARIANT_INPUT" in
            treble_arm64_*) ABI_PROFILE="arm64" ;;
            treble_arm_*) ABI_PROFILE="arm" ;;
            treble_a64_*) ABI_PROFILE="a64" ;;
            *) echo "Unsupported ABI variant: $VARIANT_INPUT" >&2; exit 2 ;;
          esac
          BUILD_PROP=$(find "$GITHUB_WORKSPACE/android_source/out/target/product" \
            -type f -name build.prop -print -quit 2>/dev/null || true)
          bash scripts/check_gsi_compatibility.sh \
            "$BUILD_PROP" \
            "$TARGET_MODEL_INPUT" \
            "$GITHUB_WORKSPACE/android_source/out_gsi/compatibility-report.txt" \
            "$ABI_PROFILE"
          cd "$GITHUB_WORKSPACE/android_source/out_gsi"
          sha256sum *.img.xz *.img.gz > SHA256SUMS.txt
          IMAGE_XZ=$(find . -maxdepth 1 -type f -name '*.img.xz' -print -quit)
          RAW_IMAGE_BYTES=$(xz --robot --list "$IMAGE_XZ" | awk -F '\t' '$1 == "totals" { print $5 }')
          RAW_IMAGE_SIZE=$(numfmt --to=iec-i --suffix=B "$RAW_IMAGE_BYTES")
          cat > build-info.txt <<EOF
          GSI build report
          ================
          Output variant: $VARIANT_INPUT
          Build type: $BUILD_TYPE_INPUT
          Manifest: $MANIFEST_URL_INPUT
          Manifest branch: $MANIFEST_BRANCH_INPUT
          Treble branch: $TREBLE_BRANCH_INPUT
          Image mode: source-built
          DSU signing: Community GSI; not signed with a Samsung/Google OEM key
          Target ABI profile: $ABI_PROFILE
          Target model: $TARGET_MODEL_INPUT
          Compatibility preflight:
          $(cat compatibility-report.txt)
          Commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Built at UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Raw image size: $RAW_IMAGE_SIZE ($RAW_IMAGE_BYTES bytes)

          Checksums:
          $(cat SHA256SUMS.txt)
          EOF
          echo "RELEASE_TAG=src-v$(date +%Y.%m.%d-%H%M%S)-${GITHUB_RUN_ID}" >> $GITHUB_ENV

      - name: "📤 Upload GSI Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.variant }}
          path: |
            ${{ github.workspace }}/android_source/out_gsi/*.img.xz
            ${{ github.workspace }}/android_source/out_gsi/*.img.gz
            ${{ github.workspace }}/android_source/out_gsi/SHA256SUMS.txt
            ${{ github.workspace }}/android_source/out_gsi/build-info.txt
            ${{ github.workspace }}/android_source/out_gsi/compatibility-report.txt
          retention-days: 7

      - name: "🏷️ Create GitHub Release"
        uses: softprops/action-gh-release@v2
        # BUG FIX: Removed 'startsWith(github.ref, "refs/heads/")' condition
        # which never fires on workflow_dispatch from the Actions UI.
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ github.event.inputs.variant }} Source GSI"
          body: |
            ## 📱 Source-Built Treble GSI
            - **Manifest**: `${{ github.event.inputs.manifest_url }}` (`${{ github.event.inputs.manifest_branch }}`)
            - **Variant**: `${{ github.event.inputs.variant }}`
            - **Build Type**: `${{ github.event.inputs.build_type }}`
            - **Treble Layer**: TrebleDroid `${{ github.event.inputs.treble_branch }}`
            - **DSU signing**: Community GSI; not signed with a Samsung/Google OEM key
            - **Built on**: Run ${{ github.run_id }}

            ### ⚡ Flashing
            Use the generated `.img.xz` or `.img.gz` with the documented GSI
            method for the target device. A generic GSI contains the system
            userspace only; every device still needs its own compatible vendor,
            kernel/boot, DTB, vbmeta, recovery, and installation procedure.
            These images are not universal Odin packages and must not be flashed
            with generic fastboot commands on devices that do not support it.
          files: |
            ${{ github.workspace }}/android_source/out_gsi/*.img.xz
            ${{ github.workspace }}/android_source/out_gsi/*.img.gz
            ${{ github.workspace }}/android_source/out_gsi/SHA256SUMS.txt
            ${{ github.workspace }}/android_source/out_gsi/build-info.txt
            ${{ github.workspace }}/android_source/out_gsi/compatibility-report.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release to Telegram
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          TELEGRAM_GSI_NAME: ${{ inputs.variant }}
          TELEGRAM_BUILD_TYPE: ${{ inputs.build_type }}
          TELEGRAM_MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
          TELEGRAM_TREBLE_BRANCH: ${{ inputs.treble_branch }}
          TELEGRAM_TARGET_MODEL: ${{ inputs.target_model }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi
          RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${RELEASE_TAG}"
          html_escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'
          }
          TELEGRAM_GSI_NAME_ESCAPED=$(printf '%s' "$TELEGRAM_GSI_NAME" | html_escape)
          TELEGRAM_BUILD_TYPE_ESCAPED=$(printf '%s' "$TELEGRAM_BUILD_TYPE" | html_escape)
          TELEGRAM_MANIFEST_BRANCH_ESCAPED=$(printf '%s' "$TELEGRAM_MANIFEST_BRANCH" | html_escape)
          TELEGRAM_TREBLE_BRANCH_ESCAPED=$(printf '%s' "$TELEGRAM_TREBLE_BRANCH" | html_escape)
          TELEGRAM_TARGET_MODEL_ESCAPED=$(printf '%s' "$TELEGRAM_TARGET_MODEL" | html_escape)
          TELEGRAM_COMPATIBILITY=$(grep -m1 '^Status:' android_source/out_gsi/compatibility-report.txt | cut -d: -f2- | xargs | html_escape)
          TELEGRAM_TEXT=$(printf '<b>%s Source GSI</b>\n<a href="%s">Open GitHub Release</a>\n\n<blockquote expandable><b>Build info</b>\nVariant: %s\nBuild type: %s\nManifest branch: %s\nTreble branch: %s\nTarget model: %s\nCompatibility: %s\nDSU signing: Community GSI; installer/device must accept community GSI signatures\nCommit: %s\n</blockquote>' \
            "$TELEGRAM_GSI_NAME_ESCAPED" "$RELEASE_URL" "$TELEGRAM_GSI_NAME_ESCAPED" \
            "$TELEGRAM_BUILD_TYPE_ESCAPED" "$TELEGRAM_MANIFEST_BRANCH_ESCAPED" \
            "$TELEGRAM_TREBLE_BRANCH_ESCAPED" "$TELEGRAM_TARGET_MODEL_ESCAPED" \
            "$TELEGRAM_COMPATIBILITY" "$GITHUB_SHA")
          if ! curl --fail --silent --show-error --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TELEGRAM_TEXT}"; then
            echo "::warning::Telegram notification failed. Check TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets."
          fi
